[project]
name = "study-tracker-frontend"
version = "0.0.0"
description = "Frontend for DevOps Study Tracker application"
readme = "README.md"
authors = [{ name = "wcl6-ml", email = "weichung.lai6@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "responses>=0.26.3",
    "uvicorn>=0.52.1",
]

[project.scripts]
study-tracker-frontend = "frontend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frontend"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
